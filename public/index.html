<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual church studio prototype</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f3; --fg: #1d1d1b; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; } }
    :root[data-theme="dark"] { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .status { color: var(--muted); margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
    figure { margin: 0; }
    figcaption { color: var(--muted); margin-bottom: 4px; }
    canvas { width: 100%; height: auto; display: block; background: #000; border: 1px solid #444; }
  </style>
</head>
<body>
  <h1>Virtual church studio prototype</h1>
  <div class="status" id="status">Connecting…</div>
  <div class="grid">
    <figure><figcaption>Cam 1 fill</figcaption><canvas id="cam1-fill" width="960" height="540"></canvas></figure>
    <figure><figcaption>Cam 1 key</figcaption><canvas id="cam1-key" width="960" height="540"></canvas></figure>
    <figure><figcaption>Cam 2 fill</figcaption><canvas id="cam2-fill" width="960" height="540"></canvas></figure>
    <figure><figcaption>Cam 2 key</figcaption><canvas id="cam2-key" width="960" height="540"></canvas></figure>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
